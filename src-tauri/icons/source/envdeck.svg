<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- EnvDeck app icon source. Regenerate the bundle icons with: npm run tauri icon src-tauri/icons/source/envdeck.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#1d3fc4"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- the deck: two cards behind the front one -->
  <rect x="300" y="236" width="472" height="560" rx="56" fill="#ffffff" opacity="0.28" transform="rotate(8 536 516)"/>
  <rect x="276" y="236" width="472" height="560" rx="56" fill="#ffffff" opacity="0.5" transform="rotate(-6 512 516)"/>
  <!-- front card: KEY=value lines -->
  <rect x="264" y="220" width="496" height="584" rx="56" fill="#ffffff"/>
  <g fill="#1d3fc4">
    <rect x="336" y="330" width="150" height="44" rx="22"/>
    <rect x="510" y="330" width="44" height="44" rx="22" opacity="0.45"/>
    <rect x="578" y="330" width="110" height="44" rx="22" opacity="0.7"/>
    <rect x="336" y="440" width="190" height="44" rx="22"/>
    <rect x="550" y="440" width="44" height="44" rx="22" opacity="0.45"/>
    <rect x="618" y="440" width="70" height="44" rx="22" opacity="0.7"/>
    <rect x="336" y="550" width="120" height="44" rx="22"/>
    <rect x="480" y="550" width="44" height="44" rx="22" opacity="0.45"/>
    <!-- masked value -->
    <circle cx="570" cy="572" r="16" opacity="0.7"/>
    <circle cx="616" cy="572" r="16" opacity="0.7"/>
    <circle cx="662" cy="572" r="16" opacity="0.7"/>
    <rect x="336" y="660" width="230" height="44" rx="22" opacity="0.25"/>
  </g>
</svg>
