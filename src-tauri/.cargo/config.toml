# Compile-time settings for EnvDeck, read by `option_env!` in src/github_auth.rs.
#
# The EnvDeck GitHub App's client ID and slug enable "Sign in with GitHub" (Push to GitHub).
# Both are public values, safe to commit: the Device Flow needs no client secret. Never put a
# client secret or private key here. Leave a value empty to build without GitHub sign-in.
#
# A real environment variable with the same name takes precedence over this file.

[env]
# GitHub App settings → General → "Client ID" (starts with "Iv", e.g. "Iv23li...").
ENVDECK_GITHUB_CLIENT_ID = "Iv23lidNuEflnvk8XN3o"
# The <slug> in the app's public link, https://github.com/apps/<slug>.
ENVDECK_GITHUB_APP_SLUG = "env-deck"
